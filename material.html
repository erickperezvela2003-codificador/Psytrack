<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PSYTrack - Recursos</title>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .grid-recursos { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; 
            margin-top: 30px; 
        }
        .card-recurso { 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            text-align: center; 
            border-top: 5px solid #8e44ad; 
            transition: transform 0.2s;
        }
        .card-recurso:hover { transform: translateY(-5px); }
        .card-recurso h3 { font-size: 16px; margin: 15px 0 5px 0; color: #2c3e50; }
        .card-recurso .type { font-size: 12px; color: #999; text-transform: uppercase; font-weight: bold; }
        .icon-big { font-size: 50px; margin-bottom: 10px; }
        
        .actions { 
            margin-top: 20px; 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
        }

        /* Modal */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; 
        }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 450px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo" onclick="window.location.href='dashboard.html'" style="cursor:pointer">🧠 PSYTrack</div>
        <div class="nav-user">
            <span id="nombreUser">Dr.</span>
            <button onclick="window.location.href='index.html'" class="btn-logout">Salir</button>
        </div>
    </nav>

    <div class="main-container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Biblioteca de Recursos</h2>
            <button class="btn-primary" style="width: auto; background-color: #8e44ad;" onclick="abrirModalSubir()">+ Subir Material</button>
        </div>

        <div id="listaMateriales" class="grid-recursos">
            <p style="grid-column: 1/-1; text-align: center; color: #999; margin-top: 50px;">Cargando biblioteca...</p>
        </div>
    </div>

    <div id="modalSubir" class="modal">
        <div class="modal-content">
            <h3>Nuevo Material de Apoyo</h3>
            <br>
            <form id="formSubir">
                <div class="input-group">
                    <label>Título del Material</label>
                    <input type="text" id="m_titulo" placeholder="Ej. Guía de Ansiedad" required>
                </div>
                
                <div class="input-group">
                    <label>Seleccionar Archivo</label>
                    <input type="file" id="m_archivo" required style="padding: 10px; border: 1px solid #ddd; width: 100%; border-radius: 8px;">
                </div>

                <div class="input-group">
                    <label>Tipo de Archivo</label>
                    <select id="m_tipo" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
                        <option value="PDF">PDF</option>
                        <option value="Imagen">Imagen (JPG/PNG)</option>
                        <option value="DOCX">Documento Word</option>
                        <option value="Video">Video</option>
                    </select>
                </div>
                
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="button" class="btn-primary" style="background:#ccc; color:black;" onclick="cerrarModal('modalSubir')">Cancelar</button>
                    <button type="submit" class="btn-primary" style="background-color: #8e44ad;">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalEnviar" class="modal">
        <div class="modal-content">
            <h3>Enviar a Paciente</h3>
            <p id="lblMaterial" style="font-size:14px; color:#8e44ad; font-weight:bold; margin-bottom:15px;"></p>
            
            <form id="formEnviar">
                <input type="hidden" id="env_id_material">
                
                <div class="input-group">
                    <label>Seleccionar Paciente</label>
                    <select id="env_paciente" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;" required>
                        <option value="">Cargando pacientes...</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Asunto</label>
                    <input type="text" id="env_asunto" value="Material de apoyo - Sesión PSYTrack" required>
                </div>
                
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="button" class="btn-primary" style="background:#ccc; color:black;" onclick="cerrarModal('modalEnviar')">Cancelar</button>
                    <button type="submit" class="btn-primary">Enviar Correo</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const idPsicologo = localStorage.getItem('id_psicologo');
        if(!idPsicologo) window.location.href = 'index.html';
        document.getElementById('nombreUser').innerText = 'Dr. ' + localStorage.getItem('nombre_psicologo');

        cargarMateriales();

        async function cargarMateriales() {
            try {
                const res = await fetch(`http://localhost:3001/api/material?id_psicologo=${idPsicologo}`);
                const materiales = await res.json();
                const container = document.getElementById('listaMateriales');
                container.innerHTML = '';

                if(materiales.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999; margin-top: 20px;">Biblioteca vacía. Sube tu primer archivo.</p>';
                } else {
                    materiales.forEach(m => {
                        let icon = '📁';
                        if (m.TipoArchivo === 'PDF') icon = '📄';
                        if (m.TipoArchivo === 'Imagen') icon = '🖼️';
                        if (m.TipoArchivo === 'Video') icon = '🎬';

                        container.innerHTML += `
                            <div class="card-recurso">
                                <div class="icon-big">${icon}</div>
                                <span class="type">${m.TipoArchivo}</span>
                                <h3>${m.Titulo}</h3>
                                <div class="actions">
                                    <button class="btn-primary btn-small" style="font-size:12px; padding: 5px 10px;" onclick="imprimirMaterial('${m.Titulo}')">🖨️ Imprimir</button>
                                    <button class="btn-primary btn-small" style="font-size:12px; padding: 5px 10px; background:#2c3e50;" onclick="prepararEnvio(${m.ID_Material}, '${m.Titulo}')">📧 Enviar</button>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (error) { console.error(error); }
        }

        document.getElementById('formSubir').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validación del archivo
            const archivoInput = document.getElementById('m_archivo');
            if(archivoInput.files.length === 0) {
                alert("⚠️ Por favor selecciona un archivo de tu computadora.");
                return;
            }

            const data = {
                id_psicologo: idPsicologo,
                titulo: document.getElementById('m_titulo').value,
                tipo: document.getElementById('m_tipo').value
            };
            
            try {
                const res = await fetch('http://localhost:3001/api/material', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if(result.success) {
                    alert('✅ Material guardado en biblioteca');
                    cerrarModal('modalSubir');
                    document.getElementById('formSubir').reset();
                    cargarMateriales();
                } else {
                    alert('Error al guardar');
                }
            } catch(err) { alert('Error de conexión'); }
        });

        document.getElementById('formEnviar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                id_paciente: document.getElementById('env_paciente').value,
                id_material: document.getElementById('env_id_material').value,
                asunto: document.getElementById('env_asunto').value
            };

            try {
                const res = await fetch('http://localhost:3001/api/material/enviar', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if(result.success) {
                    alert(`✅ ${result.message}`);
                    cerrarModal('modalEnviar');
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) { alert('Error de conexión'); }
        });

        function imprimirMaterial(titulo) {
            alert(`🖨️ Preparando impresión de: ${titulo}...`);
            window.print(); 
        }

        async function prepararEnvio(idMaterial, titulo) {
            document.getElementById('env_id_material').value = idMaterial;
            document.getElementById('lblMaterial').innerText = `Adjuntar: ${titulo}`;
            
            const res = await fetch(`http://localhost:3001/api/pacientes?id_psicologo=${idPsicologo}`);
            const pacientes = await res.json();
            const select = document.getElementById('env_paciente');
            select.innerHTML = '<option value="">Seleccione Paciente...</option>';
            pacientes.forEach(p => {
                select.innerHTML += `<option value="${p.ID_Paciente}">${p.Nombres} ${p.Apellidos}</option>`;
            });

            document.getElementById('modalEnviar').style.display = 'flex';
        }

        function abrirModalSubir() { document.getElementById('modalSubir').style.display = 'flex'; }
        function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
