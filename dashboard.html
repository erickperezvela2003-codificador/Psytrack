<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSYTrack - Menú Principal</title>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">🧠 PSYTrack</div>
        <div class="nav-user">
            <span id="nombreUser">Dr.</span>
            <button onclick="cerrarSesion()" class="btn-logout">Salir</button>
        </div>
    </nav>

    <div class="main-container">
        <h2>Bienvenido al Sistema</h2>
        <p>Seleccione un módulo para comenzar:</p>

        <div class="grid-menu">
            <div class="card-menu" onclick="window.location.href='pacientes.html'">
                <div class="icon">👥</div>
                <h3>Pacientes</h3>
                <p>Expedientes, Altas y Bajas</p>
            </div>

            <div class="card-menu" onclick="window.location.href='agenda.html'">
                <div class="icon">📅</div>
                <h3>Agenda</h3>
                <p>Citas y Programación</p>
            </div>

            <div class="card-menu" onclick="window.location.href='notas.html'">
                <div class="icon">📝</div>
                <h3>Módulo Clínico</h3>
                <p>Notas y Evolución</p>
            </div>

            <div class="card-menu" onclick="window.location.href='material.html'">
                <div class="icon">📚</div>
                <h3>Recursos</h3>
                <p>Material de Apoyo</p>
            </div>
        </div>
    </div>

    <script>
        // Verificar sesión
        const nombreGuardado = localStorage.getItem('nombre_psicologo');
        
        if (!nombreGuardado) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('nombreUser').innerText = 'Dr. ' + nombreGuardado;
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
