<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSYTrack - Iniciar Sesión</title>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">🧠</div> 
            <h1>PSYTrack</h1>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="correo" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <div class="links">
                <a href="#">Olvidé mi contraseña</a>
                <a href="registro.html">Regístrate aquí</a>
            </div>
            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, password })
                });
                const resultado = await response.json();

                if (resultado.success) {
                    // Guardamos el ID del psicólogo para usarlo en las otras pantallas
                    localStorage.setItem('id_psicologo', resultado.user.ID_Psicologo);
                    localStorage.setItem('nombre_psicologo', resultado.user.NombreCompleto);
                    
                    window.location.href = 'dashboard.html';
                } else {
                    alert('❌ Credenciales incorrectas');
                }
            } catch (error) {
                console.error(error);
                alert('Error al conectar con el servidor');
            }
        });
    </script>
</body>
</html>
