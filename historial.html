<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PSYTrack - Expediente</title>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab-btn { padding: 10px 20px; border: none; background: none; font-size: 16px; cursor: pointer; color: #777; font-weight: 600; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #4a90e2; border-bottom-color: #4a90e2; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .info-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .info-item label { font-weight: bold; color: #2c3e50; font-size: 13px; display: block; margin-bottom: 5px; }
        .info-item p { margin: 0; color: #555; font-size: 15px; }
        .nota-card { background: #fff; border: 1px solid #e1e1e1; border-left: 5px solid #27ae60; padding: 20px; margin-bottom: 15px; border-radius: 8px; }
        .nota-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; color: #888; }
        .nota-section h5 { margin: 0 0 5px 0; color: #27ae60; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 500px; max-height: 90vh; overflow-y: auto; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; resize: vertical; font-family: inherit; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo" onclick="window.location.href='dashboard.html'" style="cursor:pointer">🧠 PSYTrack</div>
        <div class="nav-user">
            <span id="nombreUser">Dr.</span>
            <button onclick="window.location.href='pacientes.html'" class="btn-logout" style="border-color:#ccc; color:#666;">Volver a Lista</button>
        </div>
    </nav>

    <div class="main-container">
        <h2 style="margin-bottom: 5px;">Expediente Clínico</h2>
        <h1 id="headerNombre" style="color: #4a90e2; margin-bottom: 30px;">Cargando...</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="abrirTab('datos', event)">Datos Generales</button>
            <button class="tab-btn" onclick="abrirTab('citas', event)">Historial de Citas</button>
            <button class="tab-btn" onclick="abrirTab('notas', event)">Notas Clínicas</button>
            <button class="tab-btn" onclick="abrirTab('docs', event)">Documentación</button>
        </div>

        <div id="datos" class="tab-content active">
            <div class="info-card">
                <div class="info-grid">
                    <div class="info-item"><label>Teléfono</label><p id="p_tel">-</p></div>
                    <div class="info-item"><label>Correo Electrónico</label><p id="p_email">-</p></div>
                    <div class="info-item"><label>Fecha de Nacimiento</label><p id="p_fecha">-</p></div>
                    <div class="info-item"><label>Dirección</label><p id="p_dir">-</p></div>
                    <div class="info-item" style="grid-column: span 2;"><label>Motivo de Consulta Inicial</label><p id="p_motivo">-</p></div>
                </div>
                
                <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; display: flex; justify-content: space-between;">
                    <div style="display:flex; gap:10px;">
                        <button onclick="abrirModalEditar()" class="btn-primary" style="width: auto; background-color: #f39c12;">✏️ Editar Datos</button>
                        <button onclick="imprimirExpediente()" class="btn-primary" style="width: auto; background-color: #34495e;">🖨️ Imprimir Expediente</button>
                    </div>
                    <button onclick="eliminarPaciente()" class="btn-primary" style="background-color: #e74c3c; width: auto;">🗑️ Eliminar Paciente</button>
                </div>
            </div>
        </div>

        <div id="citas" class="tab-content">
            <div class="info-card">
                <h3 style="margin-bottom:15px;">Historial de Citas</h3>
                <table style="width:100%; border-collapse:collapse;">
                    <thead><tr style="background:#f8f9fa;"><th style="padding:10px;">Fecha</th><th style="padding:10px;">Motivo</th><th style="padding:10px;">Estado</th></tr></thead>
                    <tbody id="tablaCitasHistorial"></tbody>
                </table>
                <p id="noCitas" style="text-align:center; padding:20px; color:#999; display:none;">Sin historial.</p>
            </div>
        </div>

        <div id="notas" class="tab-content">
            <h3 style="margin-bottom:15px;">Notas de Evolución</h3>
            <button class="btn-primary" style="width:auto; margin-bottom:20px;" onclick="abrirModalNota()">+ Nueva Nota</button>
            <div id="contenedorNotas"><p style="text-align:center; color:#999;">Cargando...</p></div>
        </div>

        <div id="docs" class="tab-content">
            <h3 style="margin-bottom:15px;">Documentos Anexos</h3>
            <button class="btn-primary" style="width:auto; margin-bottom:20px; background-color:#8e44ad;" onclick="abrirModalDoc()">+ Subir Documento</button>
            <div id="contenedorDocs"></div>
        </div>
    </div>

    <div id="modalNota" class="modal">
        <div class="modal-content">
            <h3>Nueva Nota Clínica</h3>
            <form id="formNota">
                <div class="input-group"><label>Observaciones</label><textarea id="n_obs" rows="3" required></textarea></div>
                <div class="input-group"><label>Evolución</label><textarea id="n_evo" rows="3" required></textarea></div>
                <div class="input-group"><label>Plan Terapéutico</label><textarea id="n_plan" rows="2" required></textarea></div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="button" class="btn-primary" style="background:#ccc; color:black;" onclick="cerrarModalNota()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalDoc" class="modal">
        <div class="modal-content">
            <h3>Cargar Documento</h3>
            <form id="formDoc">
                <div class="input-group"><label>Título</label><input type="text" id="d_titulo" required></div>
                <div class="input-group"><label>Archivo</label><input type="file" id="d_archivo" required style="padding:10px; border:1px solid #ddd; width:100%;"></div>
                <div class="input-group"><label>Tipo</label><select id="d_tipo" style="width:100%; padding:10px;"><option value="PDF">PDF</option><option value="Imagen">Imagen</option></select></div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="button" class="btn-primary" style="background:#ccc; color:black;" onclick="cerrarModalDoc()">Cancelar</button>
                    <button type="submit" class="btn-primary" style="background:#8e44ad;">Subir</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <h3>Editar Información</h3>
            <form id="formEditar">
                <div class="input-group"><label>Teléfono</label><input type="text" id="edit_tel" required></div>
                <div class="input-group"><label>Email</label><input type="email" id="edit_email"></div>
                <div class="input-group"><label>Dirección</label><input type="text" id="edit_dir"></div>
                <div class="input-group"><label>Motivo Consulta</label><textarea id="edit_motivo" rows="3"></textarea></div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="button" class="btn-primary" style="background:#ccc; color:black;" onclick="cerrarModalEditar()">Cancelar</button>
                    <button type="submit" class="btn-primary" style="background:#f39c12;">Actualizar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const idPaciente = localStorage.getItem('id_paciente_actual');
        const idPsicologo = localStorage.getItem('id_psicologo');
        const nombrePsi = localStorage.getItem('nombre_psicologo');

        if(!idPaciente || !idPsicologo) window.location.href = 'pacientes.html';
        document.getElementById('nombreUser').innerText = 'Dr. ' + nombrePsi;

        cargarDatosPaciente();
        cargarNotas();
        cargarDocumentos();

        function abrirTab(tabId, evt) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(evt) evt.currentTarget.classList.add('active');
        }

        async function cargarDatosPaciente() {
            const res = await fetch(`http://localhost:3001/api/pacientes/detalle?id=${idPaciente}`);
            const p = await res.json();
            document.getElementById('headerNombre').innerText = p.Nombres + ' ' + p.Apellidos;
            document.getElementById('p_tel').innerText = p.Telefono;
            document.getElementById('p_email').innerText = p.Email;
            document.getElementById('p_fecha').innerText = p.FechaNacimiento ? p.FechaNacimiento.split('T')[0] : '-';
            document.getElementById('p_dir').innerText = p.Direccion;
            document.getElementById('p_motivo').innerText = p.MotivoConsulta;
            
            const resC = await fetch(`http://localhost:3001/api/citas/historial?id_paciente=${idPaciente}`);
            const citas = await resC.json();
            const tbody = document.getElementById('tablaCitasHistorial');
            tbody.innerHTML = ''; 
            if(citas.length === 0) document.getElementById('noCitas').style.display = 'block';
            else document.getElementById('noCitas').style.display = 'none';
            
            citas.forEach(c => {
                tbody.innerHTML += `<tr><td style="padding:10px;">${new Date(c.FechaHora).toLocaleString()}</td><td style="padding:10px;">${c.Motivo}</td><td style="padding:10px;">${c.Estado}</td></tr>`;
            });
        }

        // --- FUNCIÓN EDITAR ---
        function abrirModalEditar() {
            document.getElementById('edit_tel').value = document.getElementById('p_tel').innerText;
            document.getElementById('edit_email').value = document.getElementById('p_email').innerText;
            document.getElementById('edit_dir').value = document.getElementById('p_dir').innerText;
            document.getElementById('edit_motivo').value = document.getElementById('p_motivo').innerText;
            document.getElementById('modalEditar').style.display = 'flex';
        }
        function cerrarModalEditar() { document.getElementById('modalEditar').style.display = 'none'; }

        document.getElementById('formEditar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                id: idPaciente,
                telefono: document.getElementById('edit_tel').value,
                email: document.getElementById('edit_email').value,
                direccion: document.getElementById('edit_dir').value,
                motivo: document.getElementById('edit_motivo').value
            };
            await fetch('http://localhost:3001/api/pacientes/editar', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            alert('✅ Datos actualizados correctamente');
            cerrarModalEditar();
            cargarDatosPaciente();
        });

        // --- FUNCIÓN IMPRIMIR ---
        function imprimirExpediente() {
            window.print();
        }

        async function cargarNotas() {
            const res = await fetch(`http://localhost:3001/api/notas?id_paciente=${idPaciente}`);
            const notas = await res.json();
            const div = document.getElementById('contenedorNotas');
            div.innerHTML = '';
            if(notas.length === 0) div.innerHTML = '<p style="text-align:center; color:#999;">No hay notas.</p>';
            notas.forEach(n => {
                div.innerHTML += `<div class="nota-card"><div class="nota-header"><span>📅 ${new Date(n.FechaNota).toLocaleString()}</span></div><div class="nota-section"><h5>Observaciones:</h5><p>${n.Observaciones}</p></div><div class="nota-section"><h5>Evolución:</h5><p>${n.Evolucion}</p></div><div class="nota-section"><h5>Plan:</h5><p>${n.PlanTerapeutico}</p></div></div>`;
            });
        }

        async function cargarDocumentos() {
            const res = await fetch(`http://localhost:3001/api/documentos?id_paciente=${idPaciente}`);
            const docs = await res.json();
            const div = document.getElementById('contenedorDocs');
            div.innerHTML = '';
            if(docs.length === 0) div.innerHTML = '<p style="text-align:center; color:#999;">Carpeta vacía.</p>';
            docs.forEach(d => {
                div.innerHTML += `<div style="background:white; padding:15px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;"><strong>📄 ${d.Titulo}</strong><span>${d.TipoArchivo}</span></div>`;
            });
        }

        async function eliminarPaciente() {
            if (!confirm("¿ESTÁ SEGURO DE ELIMINAR A ESTE PACIENTE?\nEsta acción quitará su acceso al expediente.")) return;
            try {
                const res = await fetch('http://localhost:3001/api/pacientes/eliminar', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: idPaciente })
                });
                const result = await res.json();
                if (result.success) {
                    alert('✅ Paciente eliminado correctamente.');
                    window.location.href = 'pacientes.html';
                } else alert('Error al eliminar');
            } catch (error) { alert('Error de conexión'); }
        }

        document.getElementById('formNota').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('http://localhost:3001/api/notas', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id_paciente: idPaciente, id_psicologo: idPsicologo,
                    observaciones: document.getElementById('n_obs').value,
                    evolucion: document.getElementById('n_evo').value,
                    plan: document.getElementById('n_plan').value
                })
            });
            alert('✅ Nota guardada'); cerrarModalNota(); cargarNotas();
        });

        document.getElementById('formDoc').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(document.getElementById('d_archivo').files.length === 0) { alert("⚠️ Selecciona un archivo."); return; }
            await fetch('http://localhost:3001/api/documentos', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id_paciente: idPaciente, titulo: document.getElementById('d_titulo').value,
                    tipo: document.getElementById('d_tipo').value
                })
            });
            alert('✅ Documento anexado'); cerrarModalDoc(); cargarDocumentos();
        });

        function abrirModalNota() { document.getElementById('modalNota').style.display = 'flex'; }
        function cerrarModalNota() { document.getElementById('modalNota').style.display = 'none'; }
        function abrirModalDoc() { document.getElementById('modalDoc').style.display = 'flex'; }
        function cerrarModalDoc() { document.getElementById('modalDoc').style.display = 'none'; }
    </script>
</body>
</html>
