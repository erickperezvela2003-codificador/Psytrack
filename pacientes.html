<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PSYTrack - Pacientes</title>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .tabla-contenedor {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #2c3e50; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; color: #555; }
        .btn-small { padding: 5px 15px; font-size: 14px; width: auto; }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { 
            background: white; padding: 30px; border-radius: 15px; width: 400px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo" onclick="window.location.href='dashboard.html'" style="cursor:pointer">🧠 PSYTrack</div>
        <div class="nav-user">
            <span id="nombreUser">Dr.</span>
            <button onclick="window.location.href='index.html'" class="btn-logout">Salir</button>
        </div>
    </nav>

    <div class="main-container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Expedientes de Pacientes</h2>
            <button class="btn-primary" style="width: auto;" onclick="abrirModal()">+ Nuevo Paciente</button>
        </div>

        <div class="tabla-contenedor">
            <table id="tablaPacientes">
                <thead>
                    <tr>
                        <th>Nombre Completo</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="bodyPacientes"></tbody>
            </table>
            <p id="mensajeVacio" style="text-align:center; padding:20px; display:none; color:#777;">No tienes pacientes registrados aún.</p>
        </div>
    </div>

    <div id="modalRegistro" class="modal">
        <div class="modal-content">
            <h3>Nuevo Expediente</h3>
            <br>
            <form id="formPaciente">
                <div class="input-group">
                    <label>Nombres</label>
                    <input type="text" id="nombreP" required>
                </div>
                <div class="input-group">
                    <label>Apellidos</label>
                    <input type="text" id="apellidoP" required>
                </div>
                <div class="input-group">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" id="fechaP" required>
                </div>
                <div class="input-group">
                    <label>Teléfono</label>
                    <input type="text" id="telP" required>
                </div>
                
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="emailP" placeholder="ejemplo@correo.com">
                </div>
                <div class="input-group">
                    <label>Dirección</label>
                    <input type="text" id="dirP" placeholder="Calle, Número, Colonia">
                </div>
                <div class="input-group">
                    <label>Motivo de Consulta</label>
                    <input type="text" id="motivoP">
                </div>
                
                <div style="display:flex; gap:10px; margin-top: 20px;">
                    <button type="button" class="btn-primary" style="background:#ccc; color:black;" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const idPsicologo = localStorage.getItem('id_psicologo');
        if (!idPsicologo) window.location.href = 'index.html';
        
        document.getElementById('nombreUser').innerText = 'Dr. ' + (localStorage.getItem('nombre_psicologo') || '');
        cargarPacientes();

        async function cargarPacientes() {
            try {
                const res = await fetch(`http://localhost:3001/api/pacientes?id_psicologo=${idPsicologo}`);
                const pacientes = await res.json();
                const tbody = document.getElementById('bodyPacientes');
                tbody.innerHTML = '';

                if (pacientes.length === 0) {
                    document.getElementById('mensajeVacio').style.display = 'block';
                } else {
                    document.getElementById('mensajeVacio').style.display = 'none';
                    pacientes.forEach(p => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${p.Nombres} ${p.Apellidos}</td>
                            <td>${p.Telefono}</td>
                            <td>
                                <button class="btn-primary btn-small" onclick="irAHistorial(${p.ID_Paciente})">Ver Expediente</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) { alert('Error al cargar la lista'); }
        }

        document.getElementById('formPaciente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = {
                id_psicologo: idPsicologo,
                nombres: document.getElementById('nombreP').value,
                apellidos: document.getElementById('apellidoP').value,
                fecha: document.getElementById('fechaP').value,
                telefono: document.getElementById('telP').value,
                email: document.getElementById('emailP').value,      // Nuevo
                direccion: document.getElementById('dirP').value,  // Nuevo
                motivo: document.getElementById('motivoP').value
            };

            try {
                const res = await fetch('http://localhost:3001/api/pacientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                const result = await res.json();

                if (result.success) {
                    alert('✅ Paciente registrado correctamente');
                    cerrarModal();
                    document.getElementById('formPaciente').reset();
                    cargarPacientes();
                } else {
                    alert('Error al guardar: ' + result.message);
                }
            } catch (error) { alert('Error de conexión'); }
        });

        function abrirModal() { document.getElementById('modalRegistro').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modalRegistro').style.display = 'none'; }
        function irAHistorial(id) {
            localStorage.setItem('id_paciente_actual', id);
            window.location.href = 'historial.html'; 
        }
    </script>
</body>
</html>
